[project]
name = "biblio"
version = "0.1.2"
description = "Gestionnaire de bibliographie local, autonome et ouvert"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "bibtexparser>=1.4,<2",
    "citeproc-py>=0.12.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "onnxruntime>=1.31.1",
    "pypdfium2>=5.15.0",
    "pywebview>=6.2.1",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23.3",
    "typer>=0.28.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
biblio = "biblio:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
